<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Custom AI Chat | 个人自定义 AI 人设对话</title>
  
  <!-- Zero-flicker Theme Initialization -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          animation: {
            'bounce-soft': 'bounce 1.2s infinite ease-in-out',
            'pulse-subtle': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Markdown Parser: Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <!-- Security Sanitizer: DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <!-- Code Syntax Highlighting: Highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- LaTeX Math Formulas: KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.4);
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: rgba(75, 85, 99, 0.7);
    }

    /* Markdown prose styles enhancement */
    .prose pre {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
    }
    .prose code:not(pre code) {
      padding: 0.15rem 0.35rem;
      border-radius: 0.375rem;
      font-size: 0.85em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .prose table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
      font-size: 0.875rem;
    }
    .prose th, .prose td {
      border: 1px solid rgba(156, 163, 175, 0.3);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    .prose th {
      background-color: rgba(156, 163, 175, 0.1);
      font-weight: 600;
    }
    .prose blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 1rem;
      margin: 0.75rem 0;
      opacity: 0.85;
      font-style: italic;
    }
    .prose p {
      margin-top: 0.4rem;
      margin-bottom: 0.4rem;
    }
    .prose ul, .prose ol {
      margin-top: 0.4rem;
      margin-bottom: 0.4rem;
      padding-left: 1.25rem;
    }
    .prose li {
      margin-top: 0.2rem;
      margin-bottom: 0.2rem;
    }
    .prose h1, .prose h2, .prose h3, .prose h4 {
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }
    .prose h1 { font-size: 1.35rem; }
    .prose h2 { font-size: 1.2rem; }
    .prose h3 { font-size: 1.05rem; }

    /* KaTeX equation display fix */
    .katex-display {
      margin: 0.5rem 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.25rem 0;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200 font-sans h-screen w-screen overflow-hidden select-none">

  <div class="flex h-screen w-screen overflow-hidden relative">
    
    <!-- Sidebar Overlay for mobile -->
    <div id="sidebar-overlay" data-testid="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 md:hidden transition-opacity duration-200 opacity-0 pointer-events-none"></div>

    <!-- Sidebar -->
    <aside id="sidebar" data-testid="sidebar" class="w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col fixed inset-y-0 left-0 z-40 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out shadow-lg md:shadow-none select-text">
      
      <!-- Sidebar Header -->
      <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-sm shadow-indigo-500/20">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <div>
            <span class="font-bold text-base text-slate-800 dark:text-slate-100 tracking-tight">Custom AI Chat</span>
            <span class="block text-[10px] text-slate-400 dark:text-slate-500 font-mono">v2.0 · Client Side</span>
          </div>
        </div>
        <div class="flex items-center space-x-1">
          <button id="sidebar-theme-toggle-btn" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors" title="切换深浅主题">
            <i data-lucide="moon" class="w-4 h-4"></i>
          </button>
          <button onclick="closeSidebar()" class="md:hidden p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Sidebar Content -->
      <div class="flex-1 overflow-y-auto p-4 space-y-5">
        
        <!-- API Configuration Panel -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider flex items-center gap-1">
              <i data-lucide="key" class="w-3.5 h-3.5"></i> API 与模型配置
            </span>
            <span id="api-status-badge" class="text-[10px] px-2 py-0.5 rounded-full font-medium bg-amber-500/10 text-amber-600 dark:text-amber-400">
              未配置密钥
            </span>
          </div>
          
          <div class="bg-slate-50 dark:bg-slate-950/60 rounded-xl p-3 border border-slate-200 dark:border-slate-800/80 space-y-2.5 transition-colors">
            <!-- Provider Preset -->
            <div>
              <label class="block text-[11px] text-slate-500 dark:text-slate-400 mb-1 font-medium">接口服务商预设</label>
              <select id="api-provider-select" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <option value="chatanywhere">ChatAnywhere (国内直连优化)</option>
                <option value="deepseek">DeepSeek 官方 API</option>
                <option value="openai">OpenAI 官方 API</option>
                <option value="siliconflow">硅基流动 (SiliconFlow)</option>
                <option value="moonshot">月之暗面 (Moonshot / Kimi)</option>
                <option value="ollama">Ollama 本地大模型</option>
                <option value="custom">自定义 Base URL</option>
              </select>
            </div>

            <!-- Base URL input -->
            <div>
              <label class="block text-[11px] text-slate-500 dark:text-slate-400 mb-1 font-medium">API 基础地址 (Base URL)</label>
              <input type="text" id="api-endpoint-input" placeholder="https://api.chatanywhere.tech/v1" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono transition-colors">
            </div>

            <!-- API Key input -->
            <div>
              <label class="block text-[11px] text-slate-500 dark:text-slate-400 mb-1 font-medium">API Key (密钥保存在本地浏览器)</label>
              <div class="relative">
                <input type="password" id="api-key-input" data-testid="api-key-input" autocomplete="off" placeholder="sk-..." class="w-full pl-2.5 pr-8 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono transition-colors">
                <button type="button" id="toggle-key-visibility-btn" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                  <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

            <!-- Context rounds limit -->
            <div class="flex items-center justify-between gap-2 pt-0.5">
              <label class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">历史记忆轮数</label>
              <select id="context-limit-select" class="px-2 py-1 text-xs rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <option value="0">单轮对话 (无记忆)</option>
                <option value="3">最近 3 轮</option>
                <option value="6" selected>最近 6 轮 (推荐)</option>
                <option value="12">最近 12 轮</option>
                <option value="999">全部保留 (消耗更多Token)</option>
              </select>
            </div>

            <!-- Save config button -->
            <button id="save-api-key-btn" data-testid="save-api-key" class="w-full mt-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-1.5 px-3 rounded-lg font-medium shadow-sm transition-all flex items-center justify-center gap-1.5 active:scale-[0.98]">
              <i data-lucide="save" class="w-3.5 h-3.5"></i> 保存配置
            </button>
          </div>
        </div>

        <!-- Personas Section -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider flex items-center gap-1">
              <i data-lucide="user-check" class="w-3.5 h-3.5"></i> AI 人设角色
            </span>
            <button data-testid="new-persona-btn" class="p-1 rounded text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="新建人设">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="personas-list" class="space-y-1">
            <!-- Personas items will be populated by JS -->
          </div>
        </div>

        <!-- Conversations Section -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider flex items-center gap-1">
              <i data-lucide="message-square" class="w-3.5 h-3.5"></i> 历史会话
            </span>
            <button data-testid="new-chat-btn" class="p-1 rounded text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="发起新对话">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Search Conversations Input -->
          <div class="relative">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="text" id="conversation-search-input" placeholder="搜索历史会话..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors">
          </div>

          <!-- Conversations List Container -->
          <div id="conversations-list" class="space-y-1 max-h-56 overflow-y-auto pr-1">
            <!-- Conversations will be populated by JS -->
          </div>
        </div>

      </div>

      <!-- Sidebar Footer -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-800 space-y-1.5 bg-slate-50/50 dark:bg-slate-950/30">
        <!-- Backup & Export Operations -->
        <div class="grid grid-cols-2 gap-1.5">
          <button id="export-json-btn" class="border border-slate-200 dark:border-slate-800 hover:bg-white dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 text-[11px] py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition-colors" title="备份全部对话与人设为 JSON">
            <i data-lucide="download" class="w-3 h-3"></i> 备份数据
          </button>
          <button id="import-json-trigger-btn" class="border border-slate-200 dark:border-slate-800 hover:bg-white dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 text-[11px] py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition-colors" title="从 JSON 备份恢复数据">
            <i data-lucide="upload" class="w-3 h-3"></i> 恢复数据
          </button>
          <input type="file" id="import-json-file" accept=".json" class="hidden">
        </div>

        <button id="clear-chats-btn" data-testid="clear-chats-btn" onclick="clearAllData()" class="w-full border border-rose-200/60 dark:border-rose-900/40 hover:bg-rose-50 dark:hover:bg-rose-950/20 text-rose-600 dark:text-rose-400 text-[11px] py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition-colors">
          <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
          <span>重置系统 / 清空数据</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200 relative select-text">
      
      <!-- Top Header -->
      <header class="flex items-center justify-between px-4 py-2.5 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-10 transition-colors">
        <div class="flex items-center space-x-3">
          <!-- Mobile Sidebar Toggle -->
          <button id="sidebar-toggle-btn" data-testid="sidebar-toggle" class="p-2 -ml-1 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 md:hidden transition-colors" title="打开侧边栏">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          
          <!-- Persona pill in header -->
          <div class="flex items-center space-x-2.5">
            <span id="header-persona-emoji" class="text-2xl flex-shrink-0">🤖</span>
            <div>
              <div class="flex items-center gap-1.5">
                <h1 id="header-persona-name" class="font-semibold text-slate-800 dark:text-slate-100 text-sm leading-tight">通用助手</h1>
                <span id="header-conversation-title" class="hidden md:inline text-xs text-slate-400 dark:text-slate-500 font-normal truncate max-w-xs"></span>
              </div>
              <div class="flex items-center gap-2 mt-0.5">
                <span id="header-persona-model" class="text-[10px] px-1.5 py-0.2 rounded bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-mono tracking-wider">gpt-4o-mini</span>
                <span id="header-provider-badge" class="text-[10px] text-slate-400 dark:text-slate-500 truncate max-w-[150px]">ChatAnywhere</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center space-x-1.5">
          <!-- Export Active Conversation as Markdown -->
          <button id="export-md-btn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors" title="导出当前会话为 Markdown 文件">
            <i data-lucide="share" class="w-4 h-4"></i>
          </button>
          <!-- Quick New Chat Button -->
          <button id="header-new-chat-btn" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors" title="开启新对话">
            <i data-lucide="square-pen" class="w-4 h-4"></i>
          </button>
          <!-- Theme Toggle Btn -->
          <button id="theme-toggle-btn" data-testid="theme-toggle" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors" title="切换深浅主题">
            <i data-lucide="moon" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- Message History List -->
      <div id="chat-messages" data-testid="chat-messages" class="flex-1 overflow-y-auto px-4 md:px-6 py-6 space-y-6 max-w-4xl mx-auto w-full relative">
        <!-- Message bubbles are injected here by JS -->
        
        <!-- Typing Indicator template -->
        <div id="typing-indicator" data-testid="typing-indicator" class="hidden flex items-center space-x-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl rounded-tl-none px-4 py-3 w-fit shadow-sm transition-colors duration-200">
          <div class="w-4 h-4 rounded-full border-2 border-indigo-600 border-t-transparent animate-spin"></div>
          <span class="text-xs text-slate-500 dark:text-slate-400">AI 思考并组织回答中...</span>
        </div>
      </div>

      <!-- Floating Scroll to Bottom Button -->
      <button id="scroll-bottom-btn" class="hidden absolute right-6 bottom-28 z-20 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 p-2.5 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all active:scale-95 flex items-center gap-1 text-xs font-medium" title="回到底部">
        <i data-lucide="arrow-down" class="w-4 h-4"></i>
        <span class="hidden sm:inline">回到底部</span>
      </button>

      <!-- Chat Input Area -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md transition-colors">
        <div class="max-w-4xl mx-auto space-y-2">
          
          <div class="flex items-end space-x-2 bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-2xl p-2.5 transition-all focus-within:ring-2 focus-within:ring-indigo-500/20 focus-within:border-indigo-500 shadow-sm">
            <textarea id="chat-input" data-testid="chat-input" rows="1" placeholder="输入问题或指示... (Enter 发送, Shift+Enter 换行)" class="w-full bg-transparent resize-none outline-none text-sm text-slate-800 dark:text-slate-100 max-h-40 min-h-[24px] py-1 px-2 leading-relaxed" style="height: auto;"></textarea>
            
            <button id="send-btn" data-testid="send-btn" class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white rounded-xl p-2.5 flex items-center justify-center transition-all flex-shrink-0 active:scale-95 shadow-sm" title="发送 (Enter)">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500 px-1">
            <span class="flex items-center gap-1">
              <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500"></i> 数据与密钥仅保存在本地浏览器
            </span>
            <span class="hidden sm:inline">Enter 发送 · Shift + Enter 换行</span>
          </div>

        </div>
      </div>

    </main>

    <!-- Persona Dialog Modal -->
    <div id="persona-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4 select-text">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transition-colors duration-200 flex flex-col max-h-[90vh]">
        
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
              <i data-lucide="bot" class="w-4 h-4"></i>
            </div>
            <h3 id="modal-title" class="font-bold text-base text-slate-800 dark:text-slate-100">配置 AI 人设</h3>
          </div>
          <button id="cancel-persona" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-1 rounded-lg">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Modal Content -->
        <div class="p-6 space-y-4 overflow-y-auto flex-1">
          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">人设名称</label>
            <input type="text" data-testid="persona-name" placeholder="例如: 智能全栈架构师" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">System Prompt (系统人设提示词)</label>
            <textarea data-testid="persona-prompt" rows="4" placeholder="例如: 你是一个拥有丰富实战经验的高级架构师..." class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors resize-none leading-relaxed"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Emoji 图标</label>
              <input type="text" data-testid="persona-emoji" value="🤖" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">预设模型</label>
              <select id="persona-model-select" data-testid="persona-model" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors font-mono">
                <option value="gpt-4o-mini">gpt-4o-mini (经济高效推荐)</option>
                <option value="gpt-4o">gpt-4o (全能旗舰)</option>
                <option value="deepseek-chat">deepseek-chat (DeepSeek-V3)</option>
                <option value="deepseek-reasoner">deepseek-reasoner (R1 推理思考)</option>
                <option value="claude-3-5-sonnet-20241022">claude-3-5-sonnet</option>
                <option value="gpt-3.5-turbo">gpt-3.5-turbo (经典)</option>
                <option value="gpt-4-turbo">gpt-4-turbo</option>
                <option value="custom">-- 自定义模型名称 --</option>
              </select>
            </div>
          </div>

          <!-- Custom Model Input (shown when needed or user customized) -->
          <div id="custom-model-container">
            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">自定义模型 ID (Model Name)</label>
            <input type="text" id="persona-custom-model" placeholder="例如: deepseek-ai/DeepSeek-V3 或 qwen-plus" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 font-mono transition-colors">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">Temperature (采样温度: 0.0 - 2.0)</label>
              <span id="temp-val-display" class="text-xs font-mono font-medium text-indigo-600 dark:text-indigo-400">0.7</span>
            </div>
            <input type="range" step="0.1" min="0" max="2" data-testid="persona-temp" id="persona-temp-slider" value="0.7" class="w-full accent-indigo-600 cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span>0.0 (严谨/精准)</span>
              <span>1.0 (均衡)</span>
              <span>2.0 (奔放/创意)</span>
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="px-6 py-4 bg-slate-50 dark:bg-slate-950/50 border-t border-slate-200 dark:border-slate-800 flex justify-end space-x-2">
          <button onclick="closePersonaModal()" class="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition-colors">
            取消
          </button>
          <button data-testid="save-persona" class="px-4 py-2 text-xs font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm transition-all flex items-center gap-1.5 active:scale-95">
            <i data-lucide="check" class="w-3.5 h-3.5"></i> 保存人设
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Main JavaScript Logic -->
  <script src="app.js"></script>
</body>
</html>
