<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人 AI 对话网站</title>
  <!-- zero-flicker head script -->

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          animation: {
            'bounce': 'bounce 1s infinite',
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom CSS transitions and animation delays */
    .animation-delay-0 {
      animation-delay: 0ms;
    }
    .animation-delay-150 {
      animation-delay: 150ms;
    }
    .animation-delay-300 {
      animation-delay: 300ms;
    }
  </style>
</head>
<body class="bg-white text-slate-800 font-sans h-screen w-screen overflow-hidden">

  <div class="flex h-screen w-screen overflow-hidden relative">
    
    <!-- Sidebar Overlay for mobile -->
    <div id="sidebar-overlay" data-testid="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-20 md:hidden transition-opacity duration-200 ease-in-out opacity-0 pointer-events-none"></div>

    <!-- Sidebar -->
    <aside id="sidebar" data-testid="sidebar" class="w-[260px] bg-[#f9f9f9] flex flex-col fixed inset-y-0 left-0 z-30 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out">
      
      <!-- Sidebar Header -->
      <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800 transition-colors duration-200">
        <div class="flex items-center space-x-2">
          <i data-lucide="bot" class="w-6 h-6 text-indigo-600 dark:text-indigo-400"></i>
          <span class="font-bold text-lg text-slate-800 dark:text-slate-100">AI 对话助手</span>
        </div>
        <button onclick="closeSidebar()" class="md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Sidebar Content -->
      <div class="flex-1 overflow-y-auto p-4 space-y-6">
        
        <!-- API Key & Settings Panel -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider">设置</span>
          </div>
          <div class="bg-slate-50 dark:bg-slate-950/50 rounded-lg p-3 border border-slate-100 dark:border-slate-800 transition-colors duration-200 space-y-2">
            <div>
              <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1">API Key</label>
              <input type="password" data-testid="api-key-input" autocomplete="off" placeholder="输入 API Key" class="w-full px-3 py-1.5 text-sm rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors duration-200">
            </div>
            <button data-testid="save-api-key" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs py-1.5 px-3 rounded font-medium transition-colors">
              保存配置
            </button>
          </div>
        </div>

        <!-- Personas Section -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">

            <button data-testid="new-persona-btn" class="p-1 rounded text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="personas-list" class="space-y-1">
            <!-- Personas items will be populated by JS -->
          </div>
        </div>

        <!-- Conversations Section -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500 pl-2 mt-4 block mb-2">今天</span>
            <button data-testid="new-chat-btn" class="p-1 rounded text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="conversations-list" class="space-y-1 max-h-60 overflow-y-auto pr-1">
            <!-- Conversations will be populated by JS -->
          </div>
        </div>

      </div>

      <!-- Sidebar Footer -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 transition-colors duration-200 space-y-2">
        <button id="clear-chats-btn" data-testid="clear-chats-btn" onclick="clearAllData()" class="w-full border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-400 text-xs py-1.5 px-3 rounded flex items-center justify-center space-x-1 transition-colors">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span>重置系统 / 清空数据</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="flex-1 flex flex-col h-full bg-white relative">
      <!-- Minimalist Top Header -->
      <header class="flex items-center justify-between px-4 py-3 bg-white w-full z-10 sticky top-0 md:hidden">
        <div class="flex items-center space-x-2">
          <button id="sidebar-toggle-btn" data-testid="sidebar-toggle" class="p-2 -ml-2 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="flex items-center hover:bg-gray-100 px-2 py-1 rounded-lg cursor-pointer transition-colors">
            <h1 id="header-persona-name" class="font-semibold text-gray-800 text-sm">ChatGPT</h1>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 ml-1"></i>
          </div>
        </div>
      </header>


      <!-- Top Header -->


      <!-- Message History List -->
      <div id="chat-messages" data-testid="chat-messages" class="flex-1 overflow-y-auto px-4 md:px-0 space-y-6 w-full max-w-3xl mx-auto pt-12 pb-32">

        <div id="empty-state" class="flex flex-col items-center justify-center mt-32 mb-8 transition-opacity duration-300">
            <h1 class="text-3xl font-semibold text-gray-800 mb-8">今天有什么计划？</h1>
        </div>

        <!-- Message bubbles are injected here by JS -->
        
        <!-- Typing Indicator template -->
        <div id="typing-indicator" data-testid="typing-indicator" class="hidden flex items-center space-x-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl rounded-tl-none px-4 py-3 w-fit shadow-sm transition-colors duration-200">
          <span class="text-xs text-slate-500 dark:text-slate-400 mr-1">AI 正在输入</span>
          <div class="flex space-x-1">
            <div class="w-2 h-2 bg-slate-400 dark:bg-slate-500 rounded-full animate-bounce animation-delay-0"></div>
            <div class="w-2 h-2 bg-slate-400 dark:bg-slate-500 rounded-full animate-bounce animation-delay-150"></div>
            <div class="w-2 h-2 bg-slate-400 dark:bg-slate-500 rounded-full animate-bounce animation-delay-300"></div>
          </div>
        </div>

      </div>


      <!-- Chat Input Area -->
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-white via-white to-transparent pt-10 pb-6 px-4">
        <div class="max-w-3xl mx-auto flex flex-col space-y-3 relative">
          <div class="flex items-center bg-[#f4f4f4] rounded-full px-4 py-2 border border-transparent focus-within:border-gray-300 transition-colors shadow-sm">
            <button class="text-gray-500 hover:text-gray-700 p-1 mr-1"><i data-lucide="plus" class="w-5 h-5"></i></button>
            <textarea id="chat-input" data-testid="chat-input" rows="1" placeholder="有问题，尽管问" class="flex-1 bg-transparent resize-none outline-none text-[15px] text-gray-800 placeholder-gray-500 max-h-[200px] py-2 overflow-hidden" style="height: auto;"></textarea>
            <button class="text-gray-500 hover:text-gray-700 p-1 mx-1"><i data-lucide="mic" class="w-5 h-5"></i></button>
            <button id="send-btn" data-testid="send-btn" class="w-8 h-8 bg-black hover:opacity-80 text-white rounded-full flex items-center justify-center transition-opacity disabled:opacity-30 disabled:bg-gray-300">
              <i data-lucide="arrow-up" class="w-4 h-4"></i>
            </button>
          </div>

          <div id="quick-actions" class="flex flex-wrap justify-center gap-2">
            <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 hover:bg-gray-50 text-gray-600 text-[13px] font-medium transition-colors">
              <i data-lucide="image" class="w-4 h-4 text-emerald-500"></i> 生成图片
            </button>
            <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 hover:bg-gray-50 text-gray-600 text-[13px] font-medium transition-colors">
              <i data-lucide="edit-3" class="w-4 h-4 text-blue-500"></i> 撰写或编辑
            </button>
            <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 hover:bg-gray-50 text-gray-600 text-[13px] font-medium transition-colors">
              <i data-lucide="globe" class="w-4 h-4 text-purple-500"></i> 查找资料
            </button>
          </div>

          <div class="text-center text-xs text-gray-400 mt-2">
            AI 可能会犯错。请核对重要信息。
          </div>
        </div>
      </div>

    </main>

    <!-- Persona Dialog Modal -->
    <div id="persona-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-950/50 backdrop-blur-sm p-4">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl w-full max-w-md overflow-hidden transition-colors duration-200">
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between transition-colors duration-200">
          <h3 id="modal-title" class="font-bold text-lg text-slate-800 dark:text-slate-100">创建新人设</h3>
          <button id="cancel-persona" class="text-slate-400 hover:text-slate-500">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <!-- Modal Content -->
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">人设名称</label>
            <input type="text" data-testid="persona-name" placeholder="例如: 翻译官" class="w-full px-3 py-2 text-sm rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors duration-200">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">系统 Prompt (人设指示)</label>
            <textarea data-testid="persona-prompt" rows="3" placeholder="例如: 你是一个精通英语和中文的专业翻译官..." class="w-full px-3 py-2 text-sm rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors duration-200 resize-none"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Emoji 图标</label>
              <input type="text" data-testid="persona-emoji" value="🤖" class="w-full px-3 py-2 text-sm rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors duration-200">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">选择模型</label>
              <select data-testid="persona-model" class="w-full px-3 py-2 text-sm rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors duration-200">
                <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                <option value="gpt-4o">gpt-4o</option>
                <option value="gpt-4-turbo">gpt-4-turbo</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Temperature (温度值: 0.0 - 2.0)</label>
            <input type="number" step="0.1" min="0" max="2" data-testid="persona-temp" value="0.7" class="w-full px-3 py-2 text-sm rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors duration-200">
          </div>
        </div>
        <!-- Modal Footer -->
        <div class="px-6 py-4 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-200 dark:border-slate-800 flex justify-end space-x-2 transition-colors duration-200">
          <button onclick="document.getElementById('persona-modal').classList.add('hidden')" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
            取消
          </button>
          <button data-testid="save-persona" class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors">
            保存
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Main JavaScript Logic -->
  <script src="app.js"></script>
</body>
</html>
